<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>控制台日志 - 宏驱动引擎</title>
<style>
:root {
  --bg: #0f1720;
  --bg-soft: #132231;
  --card: #1a2d3e;
  --text: #e8f2ff;
  --muted: #9fbbd4;
  --accent: #0eb6a4;
  --danger: #ff6b4a;
  --line: rgba(178, 209, 236, 0.2);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; color: var(--text); font-family: "Noto Sans SC","Microsoft YaHei UI","PingFang SC",sans-serif; background: var(--bg); }
.toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--line);
}
.toolbar h2 { font-size: 14px; font-weight: 600; flex: 1; }
.toolbar button {
  padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--bg-soft); color: var(--text); font-size: 12px; cursor: pointer;
}
.toolbar button:hover { background: var(--card); }
.toolbar .status { font-size: 11px; color: var(--muted); }
.console {
  flex: 1; overflow-y: auto; padding: 10px; margin: 0;
  font-family: "Cascadia Code","Fira Code","Consolas",monospace;
  font-size: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-all;
  background: var(--bg); color: var(--text);
}
.console::-webkit-scrollbar { width: 8px; }
.console::-webkit-scrollbar-thumb { background: rgba(108,154,186,0.55); border-radius: 999px; }
.console::-webkit-scrollbar-track { background: rgba(8,17,26,0.45); }
.wrap { display: flex; flex-direction: column; height: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <h2>Python 端控制台</h2>
    <span class="status" id="statusText">连接中...</span>
    <button id="btnClear">清空</button>
    <button id="btnScroll">自动滚动</button>
  </div>
  <pre class="console" id="consoleOutput"></pre>
</div>
<script>
(function() {
  var lastId = 0;
  var lineCount = 0;
  var autoScroll = true;
  var busy = false;
  var pre = document.getElementById('consoleOutput');
  var statusEl = document.getElementById('statusText');

  function apiCall(method) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve, reject) {
      var attempt = function(retries) {
        if (window.pywebview && window.pywebview.api && window.pywebview.api[method]) {
          window.pywebview.api[method].apply(window.pywebview.api, args).then(resolve).catch(reject);
        } else if (retries > 0) {
          setTimeout(function() { attempt(retries - 1); }, 300);
        } else {
          reject(new Error('API not available'));
        }
      };
      attempt(30);
    });
  }

  function poll() {
    if (busy) return;
    busy = true;
    apiCall('poll_console', lastId, 200).then(function(data) {
      var entries = data.entries || [];
      if (entries.length) {
        entries.forEach(function(item) {
          pre.textContent += '[' + item.ts + '] ' + item.text + '\n';
          lineCount++;
        });
        lastId = data.latest_id || lastId;
        if (lineCount > 4000) {
          var lines = pre.textContent.split('\n');
          pre.textContent = lines.slice(-3200).join('\n');
          lineCount = pre.textContent.split('\n').length;
        }
        if (autoScroll) pre.scrollTop = pre.scrollHeight;
      }
      statusEl.textContent = '\u2713 \u5df2\u8fde\u63a5';
    }).catch(function() {
      statusEl.textContent = '\u2717 \u8fde\u63a5\u4e2d\u65ad';
    }).finally(function() {
      busy = false;
    });
  }

  document.getElementById('btnClear').addEventListener('click', function() {
    apiCall('clear_console').then(function() {
      lastId = 0; lineCount = 0; pre.textContent = '';
    });
  });

  var scrollBtn = document.getElementById('btnScroll');
  scrollBtn.addEventListener('click', function() {
    autoScroll = !autoScroll;
    scrollBtn.textContent = autoScroll ? '\u81ea\u52a8\u6eda\u52a8' : '\u624b\u52a8\u6eda\u52a8';
    if (autoScroll) pre.scrollTop = pre.scrollHeight;
  });

  setInterval(poll, 500);
  poll();
})();
</script>
</body>
</html>
