<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自动化脚本编辑器 V2.0</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{
  --bg-deep:#0b0e13;--bg:#0f1319;--bg-raised:#151a23;--bg-surface:#1b2130;
  --bg-hover:#232b3c;--border:#262f40;--border-lt:#34405a;
  --txt:#dce3ef;--txt2:#818da6;--txt3:#4d5770;
  --acc:#22d3ee;--acc-h:#67e8f9;--acc-dim:rgba(34,211,238,.12);
  --c-action:#4ade80;--c-action-d:rgba(74,222,128,.12);
  --c-detect:#facc15;--c-detect-d:rgba(250,204,21,.12);
  --c-ctrl:#a78bfa;--c-ctrl-d:rgba(167,139,250,.12);
  --c-mon:#2dd4bf;--c-mon-d:rgba(45,212,191,.12);
  --c-var:#fb923c;--c-var-d:rgba(251,146,60,.12);
  --c-pre:#f472b6;--c-pre-d:rgba(244,114,182,.12);
  --red:#f87171;--r:7px;--rs:4px;
  --sh:0 4px 20px rgba(0,0,0,.45);--sh-s:0 2px 6px rgba(0,0,0,.35);
  --t:.18s cubic-bezier(.4,0,.2,1);
  --fui:'Noto Sans SC',system-ui,sans-serif;--fmo:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fui);background:var(--bg-deep);color:var(--txt);overflow:hidden;height:100vh;font-size:13px;line-height:1.5;user-select:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-lt)}
input,select,textarea{font-family:var(--fui);font-size:11px;color:var(--txt);background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:3px 7px;outline:none;transition:border-color var(--t)}
input:focus,select:focus{border-color:var(--acc)}
input[type=number]{width:64px;font-family:var(--fmo);font-size:11px}
input[type=text]{width:100%}
input[type=color]{width:26px;height:22px;padding:1px;cursor:pointer;border-radius:3px;border:1px solid var(--border)}
select{cursor:pointer;padding-right:16px}
input[type=checkbox]{accent-color:var(--acc);width:13px;height:13px;cursor:pointer}

#app{display:flex;flex-direction:column;height:100vh}

/* ===== TOOLBAR ===== */
#toolbar{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;background:var(--bg-raised);border-bottom:1px solid var(--border);z-index:100;flex-shrink:0}
.t-logo{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;margin-right:12px;white-space:nowrap;letter-spacing:-.3px}
.t-logo i{color:var(--acc);font-size:15px}
.t-logo .ver{color:var(--txt3);font-weight:400;font-size:10px;margin-left:3px}
.t-sep{width:1px;height:22px;background:var(--border);margin:0 2px;flex-shrink:0}
.t-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--rs);background:var(--bg-surface);color:var(--txt2);cursor:pointer;font-size:11px;white-space:nowrap;transition:all var(--t)}
.t-btn:hover{background:var(--bg-hover);color:var(--txt);border-color:var(--border-lt)}
.t-btn.pri{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
.t-btn.pri:hover{background:var(--acc-h)}
.t-btn.ok{border-color:rgba(74,222,128,.35);color:#4ade80}
.t-btn.ok:hover{background:rgba(74,222,128,.1)}
.t-btn.err{border-color:rgba(248,113,113,.35);color:#f87171}
.t-btn.err:hover{background:rgba(248,113,113,.1)}
.t-sp{flex:1}
.t-st{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--txt3)}
.t-st .dot{width:6px;height:6px;border-radius:50%;background:var(--c-action);flex-shrink:0}
.t-zm{font-family:var(--fmo);font-size:10px;color:var(--txt2);min-width:36px;text-align:center}

/* ===== WORKSPACE ===== */
#workspace{display:flex;flex:1;overflow:hidden}

/* ===== LEFT SIDEBAR ===== */
#sb-l{width:208px;flex-shrink:0;background:var(--bg-raised);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:50}
.sb-s{padding:6px;border-bottom:1px solid var(--border)}
.sb-s-w{position:relative}
.sb-s-w i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:10px;pointer-events:none}
.sb-s input{width:100%;padding:5px 8px 5px 28px;background:var(--bg);font-size:11px}
.sb-n{flex:1;overflow-y:auto;padding:2px 0}
.sb-c{margin-top:2px}
.sb-ch{display:flex;align-items:center;gap:5px;padding:5px 10px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--txt3);cursor:pointer;transition:color var(--t)}
.sb-ch:hover{color:var(--txt2)}
.sb-ch .cd{font-size:5px}
.sb-ch .ca{margin-left:auto;font-size:8px;transition:transform var(--t)}
.sb-c.col .ca{transform:rotate(-90deg)}
.sb-c.col .sb-ci{display:none}
.sb-ci{padding:1px 0}
.sb-ni{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 18px;cursor:grab;color:var(--txt2);font-size:11px;transition:all var(--t);border-left:2px solid transparent}
.sb-ni:hover{background:var(--bg-hover);color:var(--txt)}
.sb-ni:active{cursor:grabbing}
.sb-ni i{width:13px;text-align:center;font-size:10px}

/* ===== TOOLBOX ===== */
.sb-tool{border-top:1px solid var(--border);padding:6px}
.sb-tool-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--rs);cursor:pointer;font-size:11px;color:var(--txt2);transition:all var(--t);width:100%}
.sb-tool-btn:hover{background:var(--bg-hover);color:var(--txt)}
.sb-tool-btn i{font-size:11px;width:14px;text-align:center;color:var(--acc)}

/* ===== VARS ===== */
#vars-p{border-top:1px solid var(--border);max-height:160px;overflow-y:auto}
.vp-h{padding:5px 10px;font-size:10px;font-weight:600;color:var(--txt3);border-bottom:1px solid var(--border)}
.vi{display:flex;align-items:center;gap:5px;padding:3px 10px;font-size:10px}
.vi .vn{color:var(--c-var);font-family:var(--fmo);font-weight:500;min-width:44px}
.vi .vv{color:var(--txt2);font-family:var(--fmo)}
.vi .vt{color:var(--txt3);margin-left:auto;font-size:9px}

/* ===== CANVAS ===== */
#cv-area{flex:1;position:relative;overflow:hidden;background:var(--bg-deep)}
#cv-vp{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:0 0}
#cv-bg{position:absolute;top:-10000px;left:-10000px;width:20000px;height:20000px;background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
#cv-bg::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.08) 1px,transparent 1px);background-size:120px 120px}
#conn-l{position:absolute;top:0;left:0;width:20000px;height:20000px;pointer-events:none;z-index:1;overflow:visible}
#conn-l path{fill:none;stroke-width:2.5;transition:stroke-width .12s}
#conn-l path:hover{stroke-width:4}
#conn-l path.tmp{stroke-dasharray:8 4;animation:dfl .5s linear infinite}
@keyframes dfl{to{stroke-dashoffset:-12}}
#nd-l{position:absolute;top:0;left:0;width:20000px;height:20000px;z-index:2}

/* ===== NODE ===== */
.nd{position:absolute;min-width:190px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-s);transition:box-shadow .15s,border-color .15s;cursor:default}
.nd:hover{border-color:var(--border-lt)}
.nd.sel{border-color:var(--acc)!important;box-shadow:0 0 0 2px var(--acc-dim),var(--sh-s)}
.nd.drag{opacity:.88;z-index:100}
.nd-h{display:flex;align-items:center;gap:7px;padding:5px 9px;border-bottom:1px solid var(--border);border-radius:var(--r) var(--r) 0 0;font-size:11px;font-weight:500;cursor:grab}
.nd-h:active{cursor:grabbing}
.nd-h .ni{font-size:10px;width:15px;text-align:center}
.nd-h .nl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd-h .nx{width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:8px;color:var(--txt3);cursor:pointer;opacity:0;transition:all var(--t)}
.nd:hover .nx{opacity:1}
.nd-h .nx:hover{background:rgba(248,113,113,.2);color:var(--red)}
.nd-b{padding:6px 9px}
.nd-pr{display:flex;align-items:center;gap:5px;margin-bottom:4px;font-size:10px}
.nd-pr:last-child{margin-bottom:0}
.nd-pr .pl{color:var(--txt3);min-width:46px;flex-shrink:0;font-size:9px;text-align:right}
.nd-pr .pv{flex:1;display:flex;align-items:center;gap:3px}
.nd-pr .pu{color:var(--txt3);font-size:9px;flex-shrink:0}

.nd[data-c=action] .nd-h{background:linear-gradient(135deg,rgba(74,222,128,.13),rgba(74,222,128,.04))}
.nd[data-c=action] .ni{color:var(--c-action)}
.nd[data-c=detect] .nd-h{background:linear-gradient(135deg,rgba(250,204,21,.13),rgba(250,204,21,.04))}
.nd[data-c=detect] .ni{color:var(--c-detect)}
.nd[data-c=control] .nd-h{background:linear-gradient(135deg,rgba(167,139,250,.13),rgba(167,139,250,.04))}
.nd[data-c=control] .ni{color:var(--c-ctrl)}
.nd[data-c=monitor] .nd-h{background:linear-gradient(135deg,rgba(45,212,191,.13),rgba(45,212,191,.04))}
.nd[data-c=monitor] .ni{color:var(--c-mon)}
.nd[data-c=variable] .nd-h{background:linear-gradient(135deg,rgba(251,146,60,.13),rgba(251,146,60,.04))}
.nd[data-c=variable] .ni{color:var(--c-var)}
.nd[data-c=preset] .nd-h{background:linear-gradient(135deg,rgba(244,114,182,.13),rgba(244,114,182,.04))}
.nd[data-c=preset] .ni{color:var(--c-pre)}

/* ===== PORTS ===== */
.pt-r{display:flex;align-items:center;justify-content:space-between;min-height:20px}
.pt-r.i{justify-content:flex-start}.pt-r.o{justify-content:flex-end}
.pt{display:flex;align-items:center;gap:4px;padding:2px 7px;border-radius:10px;font-size:9px;color:var(--txt2);cursor:crosshair;transition:all var(--t);white-space:nowrap}
.pt:hover{color:var(--txt);background:var(--bg-hover)}
.pd{width:9px;height:9px;border-radius:50%;border:2px solid;flex-shrink:0;transition:all var(--t)}
.pt:hover .pd{transform:scale(1.3)}
.pd.con{background:currentColor}
.pt.flow .pd{border-color:var(--txt2);color:var(--txt2)}
.pt.data .pd{border-color:var(--acc);color:var(--acc);border-radius:2px;transform:rotate(45deg)}
.pt.data:hover .pd{transform:rotate(45deg) scale(1.3)}
.pi-s .pt{justify-content:flex-start;padding-left:3px}
.po-s .pt{justify-content:flex-end;padding-right:3px}

/* ===== BADGE ===== */
.nd-badge{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff;z-index:5;background:var(--c-mon);box-shadow:0 0 6px var(--c-mon-d)}

/* ===== PICK BTN ===== */
.pick-btn{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border:1px dashed var(--border-lt);border-radius:var(--rs);font-size:9px;color:var(--txt3);cursor:pointer;transition:all var(--t);background:transparent}
.pick-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-dim)}
.pick-btn.active{border-color:var(--acc);color:var(--acc);background:var(--acc-dim);animation:pls 1.2s infinite}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.5}}

/* ===== RIGHT SIDEBAR ===== */
#sb-r{width:264px;flex-shrink:0;background:var(--bg-raised);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:50}
.pp-h{padding:9px 12px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;display:flex;align-items:center;gap:7px}
.pp-h i{color:var(--acc);font-size:12px}
.pp-b{flex:1;overflow-y:auto;padding:8px 12px}
.pp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--txt3);font-size:11px;gap:7px;padding:30px}
.pp-empty i{font-size:24px;opacity:.35}
.pp-sec{margin-bottom:12px}
.pp-st{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--txt3);margin-bottom:6px}
.pp-r{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.pp-r label{font-size:10px;color:var(--txt2);min-width:54px;text-align:right;flex-shrink:0}
.pp-r .pp-i{flex:1}
.pp-r input[type=text],.pp-r input[type=number],.pp-r select{width:100%}
.pp-rg{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:5px}
.pp-rg input{width:100%;font-family:var(--fmo);font-size:10px}
.pp-rg .rl{font-size:9px;color:var(--txt3);margin-bottom:1px}
.pp-coord{display:flex;gap:3px;align-items:center}
.pp-coord input{flex:1}
.pp-coord .pick-btn{flex-shrink:0}

/* ===== CONTEXT MENU ===== */
#ctx{position:fixed;display:none;z-index:500;background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);min-width:170px;padding:3px 0}
#ctx.show{display:block}
.cx-i{display:flex;align-items:center;gap:7px;padding:5px 12px;font-size:11px;color:var(--txt2);cursor:pointer;transition:all var(--t)}
.cx-i:hover{background:var(--bg-hover);color:var(--txt)}
.cx-i i{width:13px;text-align:center;font-size:10px;color:var(--txt3)}
.cx-s{height:1px;background:var(--border);margin:3px 0}

/* ===== ADD MENU ===== */
#add-m{position:fixed;display:none;z-index:400;background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);width:240px;max-height:380px;overflow-y:auto;padding:4px 0}
#add-m.show{display:block}
.am-s{padding:3px 6px;position:relative}
.am-s i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:9px}
.am-s input{width:100%;font-size:11px;padding:4px 7px 4px 26px;background:var(--bg)}
.am-ct{padding:5px 10px 2px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--txt3)}
.am-i{display:flex;align-items:center;gap:7px;padding:4px 10px;font-size:11px;color:var(--txt2);cursor:pointer;transition:all var(--t)}
.am-i:hover{background:var(--bg-hover);color:var(--txt)}
.am-i i{width:13px;text-align:center;font-size:10px}

/* ===== TOOLBOX PANEL ===== */
#tb-panel{position:fixed;display:none;z-index:450;background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);width:350px;max-height:380px;overflow-y:auto}
#tb-panel.show{display:block}
.tb-ph{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.tb-ph i{color:var(--acc)}
.tb-pi{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background var(--t);border-bottom:1px solid var(--border)}
.tb-pi:last-child{border-bottom:none}
.tb-pi:hover{background:var(--bg-hover)}
.tb-pi-icon{width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.tb-pi-info{flex:1}
.tb-pi-info h4{font-size:11px;font-weight:600;margin-bottom:1px}
.tb-pi-info p{font-size:9px;color:var(--txt3);line-height:1.4}

/* ===== TOAST ===== */
#toast-c{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{padding:6px 16px;border-radius:var(--r);background:var(--bg-raised);border:1px solid var(--border);box-shadow:var(--sh);font-size:11px;animation:ti .25s ease-out;display:flex;align-items:center;gap:6px}
.toast.ok{border-color:rgba(74,222,128,.35)}.toast.ok i{color:var(--c-action)}
.toast.err{border-color:rgba(248,113,113,.35)}.toast.err i{color:var(--red)}
.toast.inf i{color:var(--acc)}
@keyframes ti{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ===== MINIMAP ===== */
#mm{position:absolute;bottom:10px;right:10px;width:150px;height:90px;background:rgba(15,19,25,.85);border:1px solid var(--border);border-radius:var(--r);z-index:30;overflow:hidden;backdrop-filter:blur(6px)}
#mm canvas{width:100%;height:100%}

/* ===== STATUS BAR ===== */
#sbar{height:24px;padding:0 10px;background:var(--bg-raised);border-top:1px solid var(--border);display:flex;align-items:center;gap:14px;font-size:9px;color:var(--txt3);z-index:100;flex-shrink:0}
.si{display:flex;align-items:center;gap:3px}
.si i{font-size:8px}

@keyframes rp{0%,100%{opacity:1}50%{opacity:.4}}
.run-i{animation:rp 1.4s infinite}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="t-logo"><i class="fa-solid fa-diagram-project"></i>自动化脚本编辑器<span class="ver">V2.0</span></div>
    <div class="t-sep"></div>
    <button class="t-btn ok" onclick="doRun()"><i class="fa-solid fa-play"></i>运行</button>
    <button class="t-btn" onclick="doStop()"><i class="fa-solid fa-stop"></i>停止</button>
    <button class="t-btn" onclick="doPause()"><i class="fa-solid fa-pause"></i>暂停</button>
    <div class="t-sep"></div>
    <button class="t-btn pri" onclick="doExport()"><i class="fa-solid fa-download"></i>导出</button>
    <button class="t-btn" onclick="doImport()"><i class="fa-solid fa-upload"></i>导入</button>
    <button class="t-btn" onclick="doSave()"><i class="fa-solid fa-floppy-disk"></i>保存</button>
    <div class="t-sp"></div>
    <button class="t-btn" onclick="zmIn()"><i class="fa-solid fa-plus"></i></button>
    <span class="t-zm" id="zm-lv">100%</span>
    <button class="t-btn" onclick="zmOut()"><i class="fa-solid fa-minus"></i></button>
    <button class="t-btn" onclick="zmReset()"><i class="fa-solid fa-compress"></i></button>
    <div class="t-sep"></div>
    <div class="t-st"><div class="dot" id="st-dot"></div><span id="st-txt">就绪</span></div>
  </div>

  <div id="workspace">
    <div id="sb-l">
      <div class="sb-s"><div class="sb-s-w"><i class="fa-solid fa-search"></i><input placeholder="搜索节点..." id="ns-in" oninput="filterSB(this.value)"></div></div>
      <div class="sb-n" id="np"></div>
      <div class="sb-tool">
        <div class="sb-tool-btn" onclick="openToolbox(event)"><i class="fa-solid fa-toolbox"></i>工具箱</div>
      </div>
      <div id="vars-p">
        <div class="vp-h"><i class="fa-solid fa-database" style="font-size:9px;margin-right:4px"></i>变量</div>
        <div id="vl"></div>
      </div>
    </div>

    <div id="cv-area" oncontextmenu="return false">
      <div id="cv-vp">
        <div id="cv-bg"></div>
        <svg id="conn-l" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="nd-l"></div>
      </div>
      <div id="mm"><canvas id="mm-cv"></canvas></div>
    </div>

    <div id="sb-r">
      <div class="pp-h"><i class="fa-solid fa-sliders"></i>属性面板</div>
      <div class="pp-b" id="pp-c"><div class="pp-empty"><i class="fa-solid fa-hand-pointer"></i><span>选择节点查看属性</span></div></div>
    </div>
  </div>

  <div id="sbar">
    <div class="si"><i class="fa-solid fa-cube"></i>节点: <span id="s-n">0</span></div>
    <div class="si"><i class="fa-solid fa-link"></i>连线: <span id="s-c">0</span></div>
    <div class="si"><i class="fa-solid fa-satellite-dish"></i>监视器: <span id="s-m">0</span></div>
    <div class="si"><i class="fa-solid fa-database"></i>变量: <span id="s-v">0</span></div>
    <div style="flex:1"></div>
    <div class="si">坐标: <span id="s-pos">0, 0</span></div>
  </div>
</div>

<div id="ctx"></div>
<div id="add-m"></div>
<div id="tb-panel"></div>
<div id="toast-c"></div>

<script>
/* ============================================================
   NODE DEFINITIONS

function buildSB(){
  const el=document.getElementById('np');el.innerHTML='';
  CATS.forEach(cat=>{
    const items=Object.entries(ND).filter(([,v])=>v.c===cat.id);
    const d=document.createElement('div');d.className='sb-c';d.dataset.cat=cat.id;
    d.innerHTML=`<div class="sb-ch" onclick="this.parentElement.classList.toggle('col')"><i class="cd" style="color:${cat.cl}"></i>${cat.lb}<span style="font-size:9px;color:var(--txt3);font-weight:400">(${items.length})</span><i class="ca fa-solid fa-chevron-down"></i></div><div class="sb-ci"></div>`;
    const ci=d.querySelector('.sb-ci');
    items.forEach(([t,def])=>{
      const it=document.createElement('div');it.className='sb-ni';it.dataset.type=t;it.dataset.lb=def.lb;
      it.innerHTML=`<i class="${def.ic}" style="color:${CC[def.c]}"></i>${def.lb}`;
      it.draggable=true;
      it.addEventListener('dragstart',e=>{e.dataTransfer.setData('nt',t);e.dataTransfer.effectAllowed='copy'});
      ci.appendChild(it);
    });
    el.appendChild(d);
  });
}
function filterSB(q){
  q=q.toLowerCase().trim();
  document.querySelectorAll('.sb-ni').forEach(el=>{el.style.display=(!q||el.dataset.type.includes(q)||el.dataset.lb.toLowerCase().includes(q))?'':'none'});
  document.querySelectorAll('.sb-c').forEach(cat=>{
    const vis=[...cat.querySelectorAll('.sb-ni')].filter(e=>e.style.display!=='none');
    cat.style.display=vis.length?'':'none';
    if(q&&vis.length)cat.classList.remove('col');
  });
}

function updT(){
  document.getElementById('cv-vp').style.transform=`translate(${cvO.x}px,${cvO.y}px) scale(${cvS})`;
  document.getElementById('zm-lv').textContent=Math.round(cvS*100)+'%';
  updMM();
}
function s2c(sx,sy){const r=document.getElementById('cv-area').getBoundingClientRect();return{x:(sx-r.left-cvO.x)/cvS,y:(sy-r.top-cvO.y)/cvS}}
function zmIn(){setZm(cvS*1.15)}
function zmOut(){setZm(cvS/1.15)}
function setZm(s){
  const r=document.getElementById('cv-area').getBoundingClientRect();
  const cx=r.width/2,cy=r.height/2,o=cvS;
  cvS=Math.max(.15,Math.min(3,s));const ra=cvS/o;
  cvO.x=cx-(cx-cvO.x)*ra;cvO.y=cy-(cy-cvO.y)*ra;updT();
}
function zmReset(){cvS=1;cvO={x:100,y:100};updT()}

   ============================================================ */
function addNode(t,x,y,p){
  const def=ND[t];if(!def)return;
  const id=gNid(),np={};
  def.p.forEach(p=>{np[p.k]=p&&p[p.k]!==undefined?p[p.k]:(p.df??'')});
  N[id]={id,type:t,x,y,lb:gLbl(t),params:np};
  renderNode(id);updSt();return id;
}

function renderNode(id){
  const n=N[id],def=ND[n.type];
  document.getElementById('nd-'+id)?.remove();
  const el=document.createElement('div');
  el.className='nd'+(selId===id?' sel':'');el.id='nd-'+id;el.dataset.c=def.c;el.dataset.id=id;
  el.style.left=n.x+'px';el.style.top=n.y+'px';

  let ph='';
  if(def.in.length){
    ph+='<div class="pi-s">';
    def.in.forEach(p=>{const con=C.some(c=>c.to.n===id&&c.to.p===p.id);
      ph+=`<div class="pt-r i"><div class="pt ${p.t}" data-n="${id}" data-p="${p.id}" data-d="i" data-pt="${p.t}" onmousedown="startConn(event,'${id}','${p.id}','i','${p.t}')"><div class="pd ${con?'con':''}"></div><span>${p.lb}</span></div></div>`});
    ph+='</div>';
  }
  if(def.out.length){
    ph+='<div class="po-s">';
    def.out.forEach(p=>{const con=C.some(c=>c.from.n===id&&c.from.p===p.id);
      ph+=`<div class="pt-r o"><div class="pt ${p.t}" data-n="${id}" data-p="${p.id}" data-d="o" data-pt="${p.t}" onmousedown="startConn(event,'${id}','${p.id}','o','${p.t}')"><span>${p.lb}</span><div class="pd ${con?'con':''}"></div></div></div>`});
    ph+='</div>';
  }

  let bh='';
  def.p.slice(0,5).forEach(p=>{bh+=renderPR(n.params,p)});
  if(def.p.length>5)bh+='<div style="font-size:9px;color:var(--txt3);margin-top:1px">...更多参数</div>';

  el.innerHTML=`<div class="nd-h" onmousedown="startDrag(event,'${id}')"><i class="ni ${def.ic}"></i><span class="nl">${n.lb}</span>${def.c==='monitor'?'<div class="nd-badge"><i class="fa-solid fa-satellite-dish" style="font-size:6px"></i></div>':''}<div class="nx" onclick="delNode('${id}')"><i class="fa-solid fa-xmark"></i></div></div><div>${ph}</div><div class="nd-b">${bh}</div>`;
  el.addEventListener('mousedown',e=>{if(e.target.closest('.pt')||e.target.closest('.nx'))return;selNode(id)});
  document.getElementById('nd-l').appendChild(el);
}

function renderPR(pm,p){
  const v=pm[p.k]??p.df??'';
  let inp='';
  if(p.pick){
    inp+=`<span class="pick-btn" onclick="pickCoord('${p.k}')" title="坐标拾取"><i class="fa-solid fa-crosshairs" style="font-size:8px"></i></span>`;
  }
  switch(p.t){
    case'num':inp+=`<input type="number" value="${v}" ${p.min!=null?'min="'+p.min+'"':''} ${p.max!=null?'max="'+p.max+'"':''} ${p.step?'step="'+p.step+'"':''} onchange="updNP(this,'${p.k}','num')">`;break;
    case'sel':inp+='<select onchange="updNP(this,\''+p.k+'\',\'sel\')">'+p.opts.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')+'</select>';break;
    case'clr':inp+=`<input type="color" value="${v}" onchange="updNP(this,'${p.k}','clr')">`;break;
    case'chk':inp+=`<input type="checkbox" ${v?'checked':''} onchange="updNP(this,'${p.k}','chk')">`;break;
    default:inp+=`<input type="text" value="${v}" placeholder="${p.ph||''}" onchange="updNP(this,'${p.k}','txt')">`;
  }
  return`<div class="nd-pr"><span class="pl">${p.lb}</span><div class="pv">${inp}${p.u?'<span class="pu">'+p.u+'</span>':''}</div></div>`;
}

function delNode(id){
  if(!N[id])return;
  C=C.filter(c=>c.from.n!==id&&c.to.n!==id);delete N[id];
  document.getElementById('nd-'+id)?.remove();
  if(selId===id){selId=null;renderPP()}
  renderConns();updSt();toast('节点已删除','inf');
}

function selNode(id){
  if(selId){const p=document.getElementById('nd-'+selId);if(p)p.classList.remove('sel')}
  selId=id;const el=document.getElementById('nd-'+id);if(el)el.classList.add('sel');renderPP();
}

function updNP(inp,k,t){
  if(!selId||!N[selId])return;
  let v;switch(t){case'num':v=parseFloat(inp.value)||0;break;case'chk':v=inp.checked;break;case'sel':v=inp.value;break;case'clr':v=inp.value;break;default:v=inp.value}
  N[selId].params[k]=v;
}

function setNP(k,v){if(!selId||!N[selId])return;N[selId].params[k]=v;renderNode(selId);const el=document.getElementById('nd-'+selId);if(el)el.classList.add('sel')}

  if(e.button!==0||spaceH)return;e.stopPropagation();
  dragNI=id;const n=N[id],pos=s2c(e.clientX,e.clientY);
  dragNO={x:pos.x-n.x,y:pos.y-n.y};
  document.getElementById('nd-'+id)?.classList.add('drag');
}

/* ============================================================
   CONNECTIONS
   ============================================================ */
function startConn(e,nid,pid,dir,pt){
  e.stopPropagation();e.preventDefault();
  connFrom={nid,pid,dir,pt};
  const svg=document.getElementById('conn-l');
  const pos=getPP(nid,pid,dir);
  tmpLine=document.createElementNS('http://www.w3.org/2000/svg','path');
  tmpLine.setAttribute('class','tmp');
  tmpLine.setAttribute('stroke',pt==='data'?'var(--acc)':'var(--txt2)');
  tmpLine.setAttribute('stroke-opacity','0.5');
  svg.appendChild(tmpLine);updTmp(e);
}

function getPP(nid,pid,dir){
  const pe=document.querySelector(`.pt[data-n="${nid}"][data-p="${pid}"][data-d="${dir}"]`);
  if(!pe)return{x:0,y:0};
  const r=pe.getBoundingClientRect(),nr=pe.closest('.nd').getBoundingClientRect(),n=N[nid];
  return{x:n.x+(r.left-nr.left+r.width/2)/cvS,y:n.y+(r.top-nr.top+r.height/2)/cvS};
}

function updTmp(e){
  if(!tmpLine||!connFrom)return;
  const f=getPP(connFrom.nid,connFrom.pid,connFrom.dir),to=s2c(e.clientX,e.clientY);
  const d=connFrom.dir==='o'?1:-1;
  tmpLine.setAttribute('d',d===1?`M${f.x} ${f.y}C${f.x+80} ${f.y},${to.x-80} ${to.y},${to.x} ${to.y}`:`M${f.x} ${f.y}C${f.x-80} ${f.y},${to.x+80} ${to.y},${to.x} ${to.y}`);
}

function finConn(e){
  if(!connFrom)return;
  if(tmpLine){tmpLine.remove();tmpLine=null}
  const tgt=document.elementFromPoint(e.clientX,e.clientY);
  const pe=tgt?.closest('.pt');
  if(pe){
    const tn=pe.dataset.n,tp=pe.dataset.p,td=pe.dataset.d,ttp=pe.dataset.pt;
    if(tn!==connFrom.nid&&td!==connFrom.dir&&ttp===connFrom.pt){
      if(connFrom.pt==='flow'&&td==='i')C=C.filter(c=>!(c.to.n===tn&&c.to.p===tp));
      const dup=C.some(c=>c.from.n===(connFrom.dir==='o'?connFrom.nid:tn)&&c.from.p===(connFrom.dir==='o'?connFrom.pid:tp)&&c.to.n===(connFrom.dir==='o'?tn:connFrom.nid)&&c.to.p===(connFrom.dir==='o'?tp:connFrom.pid));
      if(!dup){
        const from=connFrom.dir==='o'?{n:connFrom.nid,p:connFrom.pid}:{n:tn,p:tp};
        const to=connFrom.dir==='o'?{n:tn,p:tp}:{n:connFrom.nid,p:connFrom.pid};
        C.push({id:gCid(),from,to,type:connFrom.pt});renderConns();updSt();
      }
    }
  }
  connFrom=null;
}

function renderConns(){
  const svg=document.getElementById('conn-l');svg.innerHTML='';
  C.forEach(cn=>{
    const fd=ND[N[cn.from.n]?.type],fp=fd?.out.find(p=>p.id===cn.from.p);
    const td=ND[N[cn.to.n]?.type],tp=td?.in.find(p=>p.id===cn.to.p);
    if(!fp||!tp)return;
    const f=getPP(cn.from.n,cn.from.p,'o'),t=getPP(cn.to.n,cn.to.p,'i');
    const cl=cn.type==='data'?'#facc15':'#4b5563';
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M${f.x} ${f.y}C${f.x+80} ${f.y},${t.x-80} ${t.y},${t.x} ${t.y}`);
    path.setAttribute('stroke',cl);path.setAttribute('stroke-opacity','0.65');
    path.dataset.cid=cn.id;path.style.pointerEvents='stroke';path.style.cursor='pointer';
    path.addEventListener('click',e=>{e.stopPropagation();C=C.filter(c=>c.id!==cn.id);renderConns();updSt();toast('连线已删除','inf')});
    if(cn.type==='data'){path.setAttribute('stroke-dasharray','6 3');path.style.animation='dfl 1s linear infinite'}
    svg.appendChild(path);
  });
  document.querySelectorAll('.pd').forEach(d=>d.classList.remove('con'));
  C.forEach(cn=>{
    const fd=document.querySelector(`.pt[data-n="${cn.from.n}"][data-p="${cn.from.p}"] .pd`);
    const td=document.querySelector(`.pt[data-n="${cn.to.n}"][data-p="${cn.to.p}"] .pd`);
    if(fd)fd.classList.add('con');if(td)td.classList.add('con');
  });
}

/* ============================================================
   PROPS PANEL
   ============================================================ */
function renderPP(){
  const p=document.getElementById('pp-c');
  if(!selId||!N[selId]){p.innerHTML='<div class="pp-empty"><i class="fa-solid fa-hand-pointer"></i><span>选择节点查看属性</span></div>';return}
  const n=N[selId],def=ND[n.type];
  let h=`<div class="pp-sec"><div class="pp-st">节点信息</div><div class="pp-r"><label>类型</label><div class="pp-i" style="color:${CC[def.c]};font-weight:500">${def.lb}</div></div><div class="pp-r"><label>ID</label><div class="pp-i" style="font-family:var(--fmo);font-size:10px;color:var(--txt3)">${n.id}</div></div></div>`;
  h+='<div class="pp-sec"><div class="pp-st">参数</div>';
  def.p.forEach(pr=>{
    const v=n.params[pr.k]??pr.df??'';
    if(pr.pick){
      h+=`<div class="pp-r"><label>${pr.lb}</label><div class="pp-i pp-coord"><input type="number" value="${v}" onchange="setNP('${pr.k}',parseFloat(this.value)||0)"><span class="pick-btn" onclick="pickCoord('${pr.k}')" title="坐标拾取"><i class="fa-solid fa-crosshairs" style="font-size:8px"></i>拾取</span></div></div>`;
    } else switch(pr.t){
      case'num':h+=`<div class="pp-r"><label>${pr.lb}</label><div class="pp-i"><input type="number" value="${v}" ${pr.min!=null?'min="'+pr.min+'"':''} ${pr.max!=null?'max="'+pr.max+'"':''} ${pr.step?'step="'+pr.step+'"':''} onchange="setNP('${pr.k}',parseFloat(this.value)||0)">${pr.u?'<span class="pu">'+pr.u+'</span>':''}</div></div>`;break;
      case'sel':h+=`<div class="pp-r"><label>${pr.lb}</label><div class="pp-i"><select onchange="setNP('${pr.k}',this.value)">${pr.opts.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select></div></div>`;break;
      case'clr':h+=`<div class="pp-r"><label>${pr.lb}</label><div class="pp-i" style="display:flex;gap:5px"><input type="color" value="${v}" onchange="setNP('${pr.k}',this.value)"><input type="text" value="${v}" onchange="setNP('${pr.k}',this.value)" style="flex:1;font-family:var(--fmo)"></div></div>`;break;
      case'chk':h+=`<div class="pp-r"><label>${pr.lb}</label><div class="pp-i"><input type="checkbox" ${v?'checked':''} onchange="setNP('${pr.k}',this.checked)"></div></div>`;break;
      default:h+=`<div class="pp-r"><label>${pr.lb}</label><div class="pp-i"><input type="text" value="${v}" placeholder="${pr.ph||''}" onchange="setNP('${pr.k}',this.value)"></div></div>`;
    }
  });
  h+='</div>';
  // connections info
  const ic=C.filter(c=>c.to.n===selId),oc=C.filter(c=>c.from.n===selId);
  if(ic.length||oc.length){
    h+='<div class="pp-sec"><div class="pp-st">连接</div>';
    ic.forEach(c=>{const sn=N[c.from.n];if(sn)h+=`<div class="pp-r"><label style="color:var(--txt3)">输入</label><div class="pp-i" style="font-size:10px"><span style="color:${CC[ND[sn.type]?.c]}">${sn.lb}</span> <i class="fa-solid fa-arrow-right" style="font-size:8px;color:var(--txt3);margin:0 3px"></i>${c.to.p}</div></div>`});
    oc.forEach(c=>{const tn=N[c.to.n];if(tn)h+=`<div class="pp-r"><label style="color:var(--txt3)">输出</label><div class="pp-i" style="font-size:10px">${c.from.p} <i class="fa-solid fa-arrow-right" style="font-size:8px;color:var(--txt3);margin:0 3px"></i><span style="color:${CC[ND[tn.type]?.c]}">${tn.lb}</span></div></div>`});
    h+='</div>';
  }
  p.innerHTML=h;
}

function doExport(){
  const g={meta:{name:'自动化脚本',version:'2.0',created:new Date().toISOString()},variables:{...vars},graph:{nodes:Object.values(N).map(n=>({id:n.id,type:n.type,position:{x:Math.round(n.x),y:Math.round(n.y)},params:n.params})),connections:C.map(c=>({from:c.from,to:c.to,type:c.type}))}};
  const j=JSON.stringify(g,null,2),b=new Blob([j],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='auto_script.json';a.click();URL.revokeObjectURL(u);toast('已导出','ok');
}
function doImport(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.graph&&d.graph.nodes){clearAll();vars=d.variables||{};d.graph.nodes.forEach(n=>{nid=Math.max(nid,parseInt(n.id.replace('n',''))+1);N[n.id]={id:n.id,type:n.type,x:n.position?.x||100,y:n.position?.y||100,lb:ND[n.type]?.lb||n.type,params:n.params||{}};renderNode(n.id)});if(d.graph.connections)d.graph.connections.forEach(c=>{cid=Math.max(cid,parseInt(c.id?.replace('c',''))+1);C.push({id:c.id||gCid(),from:c.from,to:c.to,type:c.type||'flow'})});renderConns();updSt();updVars();toast('已导入','ok')}}catch(er){toast('导入失败: '+er.message,'err')}};r.readAsText(f)};inp.click();
}
function doSave(){localStorage.setItem('ae_save',JSON.stringify({N,C,vars,nid,cid,nCtr,cvO,cvS}));toast('已保存','ok')}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem('ae_save'));if(!d)return;N=d.N||{};C=d.C||{};vars=d.vars||{};nid=d.nid||1;cid=d.cid||1;nCtr=d.nCtr||{};cvO=d.cvO||{x:100,y:100};cvS=d.cvS||1;Object.keys(N).forEach(renderNode);renderConns();updT();updSt();updVars()}catch(e){}}

/* ============================================================
   MINIMAP
   ============================================================ */
function updMM(){
  const cv=document.getElementById('mm-cv'),ctx=cv.getContext('2d'),w=150,h=90;
  cv.width=w*2;cv.height=h*2;ctx.scale(2,2);ctx.clearRect(0,0,w,h);
  const nk=Object.keys(N);if(!nk.length)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  nk.forEach(id=>{const n=N[id];x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+200);y1=Math.max(y1,n.y+80)});
  const pd=60;x0-=pd;y0-=pd;x1+=pd;y1+=pd;
  const sx=w/(x1-x0||1),sy=h/(y1-y0||1),s=Math.min(sx,sy)*.85;
  const ox=(w-(x1-x0)*s)/2,oy=(h-(y1-y0)*s)/2;
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=.5;
  C.forEach(c=>{const fn=N[c.from.n],tn=N[c.to.n];if(!fn||!tn)return;ctx.beginPath();ctx.moveTo(ox+(fn.x-x0)*s+100,oy+(fn.y-y0)*s+20);ctx.lineTo(ox+(tn.x-x0)*s+100,oy+(tn.y-y0)*s+20);ctx.stroke()});
  nk.forEach(id=>{const n=N[id],d=ND[n.type];ctx.fillStyle=CC[d?.c]||'#666';ctx.globalAlpha=.6;ctx.fillRect(ox+(n.x-x0)*s,oy+(n.y-y0)*s,Math.max(3,200*s),Math.max(2,60*s))});
  ctx.globalAlpha=1;
}

}
